name: Flutter Web CI & Vercel Deploy

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Vercel deployment target'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  verify:
    name: Analyze, Test & Verify Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run full test suite
        run: flutter test

      - name: Verify release web build (PR / dry-run)
        if: github.event_name == 'pull_request'
        run: flutter build web --release

  deploy:
    name: Build & Deploy to Vercel
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Vercel target environment
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_NAME="${{ inputs.target }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV_NAME="production"
          else
            ENV_NAME="preview"
          fi
          echo "vercel_env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          if [ "$ENV_NAME" = "production" ]; then
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required GitHub Secrets
        shell: bash
        run: |
          MISSING=()
          [ -z "$SUPABASE_URL" ] && MISSING+=("SUPABASE_URL")
          [ -z "$SUPABASE_ANON_KEY" ] && MISSING+=("SUPABASE_ANON_KEY")
          [ -z "$VERCEL_TOKEN" ] && MISSING+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && MISSING+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && MISSING+=("VERCEL_PROJECT_ID")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${MISSING[*]}"
            echo "Add them under Repository Settings -> Secrets and variables -> Actions."
            echo "See docs/DEPLOYMENT_CHECKLIST.md for step-by-step setup."
            exit 1
          fi

      - name: Set up Flutter (${{ env.FLUTTER_VERSION }})
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web (release with production defines)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify critical web bundle artifacts
        shell: bash
        run: |
          REQUIRED_FILES=(
            "build/web/index.html"
            "build/web/main.dart.js"
            "build/web/manifest.json"
            "build/web/flutter_service_worker.js"
            "build/web/sqlite3.wasm"
            "build/web/drift_worker.js"
            "build/web/assets/assets/fonts/Sarabun-Regular.ttf"
            "build/web/assets/assets/fonts/Sarabun-Bold.ttf"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing critical build artifact: $file"
              exit 1
            fi
          done
          ls -lh build/web/main.dart.js build/web/sqlite3.wasm build/web/drift_worker.js

      - name: Set up Node.js for Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: |
          vercel pull --yes \
            --environment=${{ steps.target.outputs.vercel_env }} \
            --token="$VERCEL_TOKEN"

      - name: Package prebuilt Flutter Web bundle for Vercel
        run: |
          vercel build ${{ steps.target.outputs.prod_flag }} \
            --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt bundle to Vercel (${{ steps.target.outputs.vercel_env }})
        id: vercel_deploy
        shell: bash
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN")
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel Deployment (${{ steps.target.outputs.vercel_env }})"
            echo "- **URL:** $DEPLOY_URL"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
